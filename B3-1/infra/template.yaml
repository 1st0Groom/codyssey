AWSTemplateFormatVersion: '2010-09-09'
Description: B3-1 public web service on one EC2 instance in a public subnet.

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Amazon Linux 2023 AMI ID for ap-northeast-2.
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair name.
  AllowedSshCidr:
    Type: String
    Description: CIDR allowed to reach SSH. Use your public IP with /32.
    Default: 121.135.181.35/32
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$'
    ConstraintDescription: Must be an IPv4 CIDR such as 198.51.100.10/32.
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId:
        Ref: InternetGateway
      VpcId:
        Ref: VPC

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ap-northeast-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: VPC

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      SubnetId:
        Ref: PublicSubnet

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP and restricted SSH for B3-1.
      VpcId:
        Ref: VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public web traffic
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp:
            Ref: AllowedSshCidr
          Description: Restricted administration access
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId:
        Ref: AmiId
      InstanceType: t3.micro
      KeyName:
        Ref: KeyName
      SubnetId:
        Ref: PublicSubnet
      SecurityGroupIds:
        - Ref: WebSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y nginx
            mkdir -p /var/www/site
            cat > /var/www/site/index.html <<'HTML'
            <!doctype html>
            <html lang="ko">
            <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B3-1 Cloud Portfolio</title></head>
            <body><main><h1>B3-1 Cloud Portfolio</h1><p>VPC와 EC2에 배포된 웹 서비스입니다.</p><p><a href="/health">health check</a></p></main></body>
            </html>
            HTML
            cat > /etc/nginx/conf.d/b3-1.conf <<'NGINX'
            server {
                listen 80 default_server;
                server_name _;
                root /var/www/site;
                index index.html;
                location = /health {
                    default_type text/plain;
                    return 200 "OK\n";
                }
                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX
            rm -f /etc/nginx/conf.d/default.conf
            nginx -t
            systemctl enable --now nginx
Outputs:
  InstanceId:
    Description: EC2 instance ID
    Value:
      Ref: WebServer
  PublicIp:
    Description: Public IPv4 address
    Value:
      Fn::GetAtt:
        - WebServer
        - PublicIp
